[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fr3-cartesian"
version = "0.1.0"
description = "Guided FAIRINO FR3 tool and workplane calibration with Cartesian motion"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7", "numpy>=2.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
fr3-cartesian = "fr3_cartesian.app:main"

[tool.setuptools.packages.find]
include = ["fr3_cartesian*"]

[tool.setuptools.package-data]
fr3_cartesian = ["locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
